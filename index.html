<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/4872339dd4.js" crossorigin="anonymous"></script>
    <title>Hexa Tune</title>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-music"></i>Hexa Tune</h1>
            <p class="subtitle">Your music, your playlist, your vibe — upload your favorite tracks and enjoy them your way. 🎵</p>
        </header>
        
        <div class="player-container">
            <div class="player">
                <div class="album-art-container">
                    <div class="default-art" id="default-art">
                        <i class="fa-solid fa-music"></i>
                        <p>Actual song thumbline will appear here</p>
                    </div>
                    <img class="album-art" id="album-image" src="">
                </div>

                <div class="track-info">
                    <h2 class="track-title" id="track-title">No track selected</h2>
                    <p class="track-artist" id="track-artist">Upload Your Music 🎵</p>
                    <p class="track-album" id="track-album"></p>
                </div>
            </div>

        </div>

    </div>
    
</body>
</html>
